name: Publish ZeoStudio TenGate V5.0.0

# Owner-triggered only. No tag, release, or upload occurs on pull requests or pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tengate-v5-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify reviewed baseline and release metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE=6808c187f8456fb590f56e7345fbc480e104d7ca
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/publish-v5.yml|RELEASE_NOTES_V5.0.0.md|RELEASE_CHECKLIST_V5.0.0.md) ;;
              *) echo "UNREVIEWED FILE CHANGE: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          python - <<'PY'
          import pathlib, tomllib
          pkg = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert pkg["project"]["version"] == "5.0.0", "version mismatch"
          assert pkg["project"]["requires-python"] == ">=3.11", "unexpected Python baseline"
          PY

      - name: Install build tools and project
        run: |
          python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-deps --no-build-isolation .

      - name: Run all release and reliability gates
        run: python tools/release_validate.py --full

      - name: Build source, wheel, SBOM, checksums and manifest
        run: python tools/release_bundle.py --skip-validation --output build/release

      - name: Check release asset integrity
        shell: bash
        run: |
          set -euo pipefail
          cd build/release
          sha256sum -c SHA256SUMS
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path("RELEASE_MANIFEST.json").read_text())
          assert m["version"] == "5.0.0" and m["status"] == "ready_for_review"
          for name, expected in m["artifacts"].items():
              path = Path(name)
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, name
          assert len(list(Path().glob("*.whl"))) == 1
          assert len(list(Path().glob("*-source.zip"))) == 1
          PY

      - name: Refuse duplicate release or tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v5.0.0 >/dev/null 2>&1; then
            echo "v5.0.0 Release already exists"; exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v5.0.0" >/dev/null 2>&1; then
            echo "v5.0.0 tag already exists"; exit 1
          fi

      - name: Publish reviewed release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v5.0.0 \
            build/release/*-source.zip \
            build/release/*.whl \
            build/release/SBOM.spdx.json \
            build/release/SHA256SUMS \
            build/release/RELEASE_MANIFEST.json \
            --target "${GITHUB_SHA}" \
            --title "ZeoStudio TenGate V5.0.0 — Governance & Coordination Kernel" \
            --notes-file RELEASE_NOTES_V5.0.0.md
          gh release view v5.0.0 --json url,tagName,assets
